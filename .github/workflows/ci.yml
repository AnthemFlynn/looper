name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig build test
        run: zig build test

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - aarch64-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@v4
        with:
          name: looper-${{ matrix.target }}
          path: zig-out/bin/looper
          if-no-files-found: error
